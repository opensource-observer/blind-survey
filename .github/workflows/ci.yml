name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Tests
        run: uv run pytest -q

      # A compiled artifact is what a respondent reads. If it no longer builds,
      # nothing downstream is worth checking.
      - name: Participant artifacts compile
        run: uv run python build/compile.py

      # The example pool ships in the repo, so it has to stay free of provider
      # fields, dates, emails and links.
      - name: Example pool is clean
        run: uv run python tools/check_pool.py --pool examples/oso-ecosystem/pool --strict
